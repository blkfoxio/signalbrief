[phases.setup]
# WeasyPrint needs pango/cairo/gdk-pixbuf/fontconfig at runtime for PDF export.
nixPkgs = ["python311", "pango", "cairo", "gdk-pixbuf", "fontconfig", "harfbuzz", "libffi"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate --noinput && gunicorn signalbrief.asgi:application -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT"
