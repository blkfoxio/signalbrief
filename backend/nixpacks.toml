[phases.setup]
nixPkgs = ["python311"]
# WeasyPrint dlopens these at runtime. List every shared lib explicitly —
# nixpacks's runtime image doesn't preserve transitive apt deps reliably,
# so relying on libpango to pull in glib/freetype/fontconfig isn't enough.
# libglib2.0-0 is the one that actually provides libgobject-2.0.so.0.
aptPkgs = [
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libharfbuzz0b",
    "libglib2.0-0",
    "libfontconfig1",
    "libfreetype6",
    "shared-mime-info",
    "fonts-liberation",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate --noinput && gunicorn signalbrief.asgi:application -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT"
