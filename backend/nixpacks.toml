[phases.setup]
nixPkgs = ["python311"]
# WeasyPrint dlopens pango/glib/harfbuzz at runtime. nixPkgs installs to the
# Nix store which isn't on the default ld search path, so these have to be
# apt-installed (which lands them in /usr/lib where ldconfig finds them).
# libpango-1.0-0 transitively pulls in glib/gobject/freetype/fontconfig.
aptPkgs = [
    "libpango-1.0-0",
    "libpangoft2-1.0-0",
    "libharfbuzz0b",
    "shared-mime-info",
    "fonts-liberation",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate --noinput && gunicorn signalbrief.asgi:application -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:$PORT"
